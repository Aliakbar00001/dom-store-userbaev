<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Алатау — склад снаряжения</title>
<style>
  :root{
    --night:#0B1F33;
    --slate:#16283B;
    --snow:#F5F8FB;
    --snow-dim:#C7D3DE;
    --ice:#8FD3E8;
    --sunset:#FF7A45;
    --line:#2A3F55;
    --error:#E0524C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--night);
    color:var(--snow);
    font-family:system-ui, sans-serif;
    padding:40px 20px;
  }
  .wrap{max-width:760px; margin:0 auto;}
  h1{font-size:1.6rem; margin-bottom:6px;}
  .subtitle{color:var(--snow-dim); margin-bottom:32px;}

  form{
    display:grid;
    grid-template-columns:1fr 1fr 1fr auto;
    gap:14px;
    align-items:start;
    background:var(--slate);
    padding:20px;
    border-radius:6px;
    margin-bottom:32px;
  }
  .field{display:flex; flex-direction:column; gap:4px;}
  label{font-size:0.8rem; color:var(--snow-dim);}
  input{
    background:var(--night);
    border:1px solid var(--line);
    color:var(--snow);
    padding:10px;
    border-radius:4px;
    font-size:0.95rem;
  }
  input:focus{outline:2px solid var(--ice);}
  .error-text{color:var(--error); font-size:0.78rem; min-height:16px;}
  button[type="submit"]{
    background:var(--sunset);
    border:none;
    color:#1a0d06;
    font-weight:700;
    padding:10px 18px;
    border-radius:4px;
    cursor:pointer;
    height:42px;
    align-self:end;
  }

  table{width:100%; border-collapse:collapse; margin-bottom:20px;}
  th, td{padding:12px 10px; text-align:left; border-bottom:1px solid var(--line);}
  th{color:var(--snow-dim); font-size:0.85rem; font-weight:600;}

  .qty-cell{display:flex; align-items:center; gap:10px;}
  .qty-btn{
    background:var(--night);
    border:1px solid var(--line);
    color:var(--snow);
    width:28px; height:28px;
    border-radius:4px;
    cursor:pointer;
    font-size:1rem;
  }
  .qty-btn:hover{border-color:var(--ice);}
  .qty-value{min-width:20px; text-align:center;}

  .remove-btn{
    background:transparent;
    border:1px solid var(--error);
    color:var(--error);
    padding:6px 12px;
    border-radius:4px;
    cursor:pointer;
    font-size:0.85rem;
  }
  .remove-btn:hover{background:rgba(224,82,76,0.12);}

  .total-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:1.2rem;
    padding:16px 0;
    border-top:1px solid var(--line);
  }
  #total{color:var(--ice); font-weight:700;}

  @media (max-width:560px){
    form{grid-template-columns:1fr;}
    button[type="submit"]{align-self:stretch;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Алатау — склад снаряжения</h1>
  <p class="subtitle">Добавляйте товары, меняйте количество и удаляйте строки — итог пересчитывается сам.</p>

  <form id="addForm" novalidate>
    <div class="field">
      <label for="name">Название</label>
      <input type="text" id="name" placeholder="Например, Маска">
      <span class="error-text" id="nameError"></span>
    </div>
    <div class="field">
      <label for="price">Цена, ₸</label>
      <input type="number" id="price" placeholder="2000">
      <span class="error-text" id="priceError"></span>
    </div>
    <div class="field">
      <label for="qty">Количество</label>
      <input type="number" id="qty" placeholder="1">
      <span class="error-text" id="qtyError"></span>
    </div>
    <button type="submit">Добавить</button>
  </form>

  <table id="productTable">
    <thead>
      <tr>
        <th>Название</th>
        <th>Цена</th>
        <th>Количество</th>
        <th>Сумма</th>
        <th></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="total-row">
    <span>Итого</span>
    <span id="total">0 ₸</span>
  </div>
</div>

<script src="src/store.js"></script>
<script src="src/app.js"></script>
</body>
</html>
